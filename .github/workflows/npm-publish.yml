name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
      preid:
        description: Prerelease identifier
        required: false
        default: alpha
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch --set-upstream-to="origin/${GITHUB_REF_NAME}"

      - name: Build admin UI
        run: npm run build:admin

      - name: Check syntax
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Prepare release commit and tag
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          if [[ "$BUMP" == pre* ]]; then
            printf '%s\n' "${PREID:-alpha}" | npm run release -- "$BUMP" --yes
          else
            npm run release -- "$BUMP" --yes
          fi

      - name: Verify release tag
        run: npm run release:verify-tag

      - name: Publish package
        run: npm publish --access public
