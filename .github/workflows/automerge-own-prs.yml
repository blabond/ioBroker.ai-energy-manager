name: automatisch mergen my PR

on:
  workflow_run:
    workflows: ["Test and Release"]
    types: [completed]

jobs:
  merge-own-pr:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Erfolgreichen eigenen Pull Request mergen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRUSTED_AUTHOR: blabond
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          pr_number="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
          if [ -z "${pr_number}" ]; then
            echo "Kein Pull Request fuer diesen Workflow-Lauf gefunden."
            exit 0
          fi

          author="$(gh pr view "${pr_number}" --repo "${REPO}" --json author --jq '.author.login')"
          state="$(gh pr view "${pr_number}" --repo "${REPO}" --json state --jq '.state')"
          is_draft="$(gh pr view "${pr_number}" --repo "${REPO}" --json isDraft --jq '.isDraft')"
          incomplete_or_failed_checks="$(gh pr view "${pr_number}" --repo "${REPO}" --json statusCheckRollup --jq '[.statusCheckRollup[] | select((.status != "COMPLETED") or (.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL"))] | length')"

          if [ "${author}" != "${TRUSTED_AUTHOR}" ]; then
            echo "Pull Request #${pr_number} stammt von ${author}; Auto-Merge ist nur fuer ${TRUSTED_AUTHOR} erlaubt."
            exit 0
          fi
          if [ "${state}" != "OPEN" ]; then
            echo "Pull Request #${pr_number} ist nicht offen."
            exit 0
          fi
          if [ "${is_draft}" = "true" ]; then
            echo "Pull Request #${pr_number} ist ein Draft."
            exit 0
          fi
          if [ "${incomplete_or_failed_checks}" != "0" ]; then
            echo "Pull Request #${pr_number} hat noch offene oder fehlgeschlagene Checks."
            exit 0
          fi

          gh pr merge "${pr_number}" --repo "${REPO}" --merge --delete-branch
