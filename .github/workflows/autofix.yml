name: Auto-fix

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix ESLint/Prettier
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.AUTOFIX_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ESLint auto-fixes
        run: npm run lint:fix

      - name: Apply Prettier formatting
        run: npm run format

      - name: Commit and push fixes if needed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): apply eslint/prettier auto-fixes"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          else
            echo "No formatting/lint fixes needed."
          fi
